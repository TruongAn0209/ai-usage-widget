<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <link rel="stylesheet" href="settings.css" />
  <title>Settings</title>
</head>
<body>
  <div id="settingsMode" role="tablist" aria-label="Settings level">
    <button id="modeCompact" role="tab" type="button"></button>
    <button id="modeFull" role="tab" type="button"></button>
  </div>

  <h2 id="hDisplay"></h2>
  <label><span id="lblLayout"></span>
    <select id="layout">
      <option value="bars"></option>
      <option value="rings"></option>
      <option value="strip"></option>
      <option value="dashboard"></option>
      <option value="terminal"></option>
    </select>
  </label>
  <label><span id="lblPalette"></span>
    <select id="palette">
      <option value="espresso"></option>
      <option value="dark"></option>
      <option value="light"></option>
      <option value="default"></option>
      <option value="catppuccin"></option>
      <option value="dracula"></option>
      <option value="nord"></option>
      <option value="gruvbox"></option>
    </select>
  </label>
  <label class="adv"><span id="lblCompact"></span><input type="checkbox" id="compact" /></label>
  <label class="adv"><span id="lblOpacity"></span><b id="opacityVal" class="bold"></b>
    <input type="range" id="opacity" min="0.15" max="1" step="0.05" /></label>
  <div class="hint adv" id="hintOpacity"></div>
  <label class="adv"><span id="lblHoverBoost"></span><input type="checkbox" id="hoverBoost" /></label>
  <label class="adv"><span id="lblWidth"></span><input type="number" id="width" min="200" max="460" step="10" /></label>
  <label class="adv"><span id="lblShowContext"></span><input type="checkbox" id="showContext" /></label>
  <label class="adv"><span id="lblContextLimit"></span>
    <select id="contextLimit">
      <option value="auto" id="optContextAuto"></option>
      <option value="200000">200k</option>
      <option value="1000000">1M</option>
    </select>
  </label>
  <div class="hint adv" id="hintContextLimit"></div>
  <label class="adv"><span id="lblShowForecast"></span><input type="checkbox" id="showForecast" /></label>
  <div class="hint adv" id="hintShowForecast"></div>
  <label class="adv"><span id="lblTopMetricOnly"></span><input type="checkbox" id="topMetricOnly" /></label>
  <div class="hint adv" id="hintTopMetricOnly"></div>
  <label><span id="lblPreset"></span>
    <select id="preset">
      <option value="" id="optPresetNone"></option>
      <option value="full" id="optPresetFull"></option>
      <option value="compact" id="optPresetCompact"></option>
      <option value="work" id="optPresetWork"></option>
    </select>
  </label>

  <h2 id="hProviders"></h2>
  <div class="hint" id="hintProvidersOrder"></div>
  <div id="providers"></div>
  <div class="hint" id="providersHint"></div>

  <h2 class="adv" id="hConfig"></h2>
  <div class="row-flex adv">
    <button id="exportCfg"></button>
    <button id="importCfg"></button>
  </div>
  <div class="hint adv" id="hintConfigSafe"></div>

  <h2 id="hAlerts"></h2>
  <label><span id="lblAlertsEnabled"></span><input type="checkbox" id="alertsEnabled" /></label>
  <label><span id="lblAlertWarn"></span><input type="number" id="alertWarnPct" min="10" max="99" /></label>
  <label><span id="lblAlertCrit"></span><input type="number" id="alertCritPct" min="20" max="100" /></label>

  <h2 class="adv" id="hRefreshRate"></h2>
  <label class="adv"><span id="lblRefreshApi"></span><input type="number" id="refreshApiSec" min="180" max="3600" step="30" /></label>
  <div class="hint adv" id="hintRefreshApiFloor"></div>
  <label class="adv"><span id="lblRefreshLocal"></span><input type="number" id="refreshLocalSec" min="2" max="120" /></label>

  <h2 id="hSystem"></h2>
  <label><span id="lblLanguage"></span>
    <select id="lang">
      <option value="auto" id="optLangAuto"></option>
      <option value="vi" id="optLangVi"></option>
      <option value="en" id="optLangEn"></option>
    </select>
  </label>
  <label><span id="lblAlwaysOnTop"></span><input type="checkbox" id="alwaysOnTop" /></label>
  <label><span id="lblLocked"></span><input type="checkbox" id="locked" /></label>
  <label class="adv"><span id="lblFollowClaudeCli"></span><input type="checkbox" id="followClaudeCli" /></label>
  <div class="hint adv" id="hintFollowClaudeCli"></div>
  <label class="adv"><span id="lblHotkey"></span><input type="text" id="hotkey" /></label>
  <label class="adv"><span id="lblLaunchAtLogin"></span><input type="checkbox" id="launchAtLogin" /></label>
  <div id="err"></div>
  <div class="row-flex row-flex-top">
    <button id="refresh"></button>
    <button id="reset" class="adv"></button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
