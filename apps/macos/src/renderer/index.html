<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="style.css" />
  <title>AI Usage</title>
</head>
<body data-palette="espresso" data-layout="bars">
  <div id="card">
    <div id="drag">
      <span class="dot"></span><span class="title" id="titleText">AI Usage</span><span class="plan" id="plan"></span>
      <button id="btn-refresh" class="hbtn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 8a5.5 5.5 0 0 1 9.35-3.9M13.5 8a5.5 5.5 0 0 1-9.35 3.9"/>
          <polyline points="13.5 3 13.5 6 10.5 6"/>
          <polyline points="2.5 13 2.5 10 5.5 10"/>
        </svg>
      </button>
      <button id="btn-settings" class="hbtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="2.6"/>
          <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/>
        </svg>
      </button>
    </div>
    <div id="status"></div>
    <!-- Chuỗi tĩnh dưới đây chỉ hiện trong CHỚP NHOÁNG trước lượt push dữ liệu đầu tiên từ main.js
         (kèm strings đã dịch) — render() ghi đè ngay sau đó, xem renderer.js. -->
    <div id="body"><div class="msg">…</div></div>
    <!-- Panel mở rộng: số phiên/hôm nay. Bố cục "strip" ẩn hẳn phần này cho thật gọn.
         ★ mục 13: PHẢI là <button> có aria-expanded — trước đây là <div> chỉ nghe 'click', bấm
         Tab không tới được, đọc màn hình không biết đang mở/đóng. -->
    <button id="expand" type="button" class="expand-hint" title="" aria-expanded="false">▾</button>
    <div id="panel"></div>
    <div id="foot"><span id="updated"></span><span class="spacer"></span><span id="sessions"></span></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
