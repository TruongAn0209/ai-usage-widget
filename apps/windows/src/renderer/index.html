<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-palette="default" data-layout="standard">
    <div id="card" class="card">
      <div class="titlebar" id="titlebar">
        <span class="title-wrap"><img class="brand-icon" src="tray.png" alt="" /><span class="title">AI Usage Widget</span></span>
        <span class="tb-actions">
          <span class="gear" id="settingsBtn" title="Settings">&#9881;</span>
          <span class="close" id="closeBtn">&times;</span>
        </span>
      </div>
      <div class="plan" id="planLine"></div>
      <div class="last-update main-update" id="mainLastUpdate">--</div>

      <!-- Khi chưa tìm thấy AI nào trên máy -->
      <div class="empty" id="emptyState" style="display: none">
        <div class="empty-title" id="emptyTitle"></div>
        <div class="empty-body" id="emptyBody"></div>
        <div class="empty-hint" id="emptyHint"></div>
        <button class="empty-btn" id="emptyRefresh"></button>
      </div>

      <!-- Phần chính: do renderer.js dựng theo bố cục đang chọn -->
      <div id="mainContent"></div>

      <div class="expand-hint" id="expandHint">▾</div>

      <div class="expanded" id="expandedPanel">
        <div id="sessionSection">
          <div class="section-title" id="sessionsTitle"></div>
          <div class="session-list" id="sessionList"></div>
        </div>
        <div id="todaySection">
          <div class="section-title" id="todayTitle"></div>
          <div class="stat-line"><span id="lblTodayTokens"></span><b id="todayTokens">--</b></div>
          <div class="stat-line"><span id="lblTodayCost"></span><b id="todayCost">--</b></div>
          <div class="stat-line"><span id="lblTodayMsgs"></span><b id="todayMsgs">--</b></div>
          <div class="stat-line"><span id="lblBurnRate"></span><b id="burnRate">--</b></div>
          <div class="model-list" id="modelList"></div>
          <div class="last-update" id="lastUpdate">--</div>
        </div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
