name: Báo lỗi
description: Báo lỗi đã che mọi credential và dữ liệu riêng tư
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Không đính kèm token, auth.json, .env, transcript hoặc nội dung Keychain.
  - type: input
    id: version
    attributes:
      label: Phiên bản app
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Nền tảng
      options:
        - Windows 10/11 x64
        - macOS Apple Silicon
        - macOS Intel
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Phiên bản hệ điều hành
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cách tái hiện
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
    validations:
      required: true
